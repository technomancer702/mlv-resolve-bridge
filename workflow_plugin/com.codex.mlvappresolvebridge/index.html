<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLV-App Resolve Bridge</title>
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <main class="shell">
      <section id="dropZone" class="drop-zone">
        <div>
          <h1>Drop MLV clips</h1>
          <p>Exports through the configured bridge adapter, then imports into the current Media Pool bin.</p>
        </div>
      </section>

      <section class="settings">
        <label>
          Python
          <input id="pythonInput" value="python">
        </label>
        <label>
          Bridge repo root
          <input id="repoRootInput" placeholder="F:\Coding Projects\mlvapp-resolve-bridge">
        </label>
        <label>
          Config JSON
          <input id="configInput" placeholder="Optional path to config.local.json">
        </label>
      </section>

      <section class="actions">
        <button id="browseButton" type="button">Browse</button>
        <button id="runButton" type="button" disabled>Export and Import</button>
        <button id="clearButton" type="button" disabled>Clear</button>
      </section>

      <section>
        <h2>Queue</h2>
        <ul id="queue" class="queue"></ul>
      </section>

      <section>
        <h2>Log</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
